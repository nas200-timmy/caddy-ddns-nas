name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要 gofmt："
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race ./...

  smoke:
    name: 二进制冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - run: make build
      - name: 二进制可执行
        run: |
          ./bin/cddns version
          ./bin/cddns --help
      - name: 向导 pty 冒烟测试
        run: python3 ./scripts/smoke_wizard.py

  docker:
    name: 镜像多架构构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: 构建 amd64/arm64/armv7 镜像（仅校验，不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 单独构建 arm64 镜像并载入本地
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: cddns:arm64-check
          cache-from: type=gha
      # 光"构建成功"不足以说明交叉编译生效，必须验证镜像里二进制的真实架构
      - name: 校验镜像内二进制确实是 AArch64
        run: |
          set -e
          cid=$(docker create cddns:arm64-check)
          docker cp "$cid:/usr/local/bin/cddns" /tmp/cddns-arm64
          docker rm "$cid" >/dev/null
          # ELF 头 offset 18 的 e_machine：183=AArch64 / 62=x86-64 / 40=ARM
          machine=$(head -c 20 /tmp/cddns-arm64 | od -An -tu1 | tr -s ' \n' ' ' | awk '{print $19}')
          echo "e_machine=$machine"
          [ "$machine" = "183" ] || {
            echo "::error::镜像里的二进制不是 AArch64，交叉编译参数没生效"
            exit 1
          }
          docker image inspect cddns:arm64-check --format '镜像架构={{.Architecture}}'
      - name: 在 QEMU 下真实启动 arm64 镜像
        run: |
          docker run --rm cddns:arm64-check version
          docker run --rm cddns:arm64-check --help | head -3
